<style>

}
*{box-sizing:border-box}

.wrap{max-width:960px;margin:0 auto}
header{position:relative;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:44px max(16px,env(safe-area-inset-left,0px)) 28px;overflow:hidden;background:linear-gradient(180deg,var(--sky),var(--bg))}
#stars{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
header .wrap{position:relative}
h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,9vw,72px);line-height:1;margin:0;letter-spacing:-.01em}
h1 em{color:var(--lamp)}
.lede{color:var(--muted);margin:10px 0 0;max-width:46ch}
.presets{display:flex;gap:8px;overflow-x:auto;padding:22px 0 4px;scrollbar-width:none}
.presets::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 13px var(--body);padding:8px 14px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.chip:hover{border-color:var(--moon)}
.chip .x{color:var(--muted);font-size:15px;line-height:1;padding:0 2px}
.chip .x:hover{color:var(--lamp)}
.label{font:600 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
section{margin-top:28px}
section h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0 0 12px;text-wrap:balance}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid transparent;border-radius:14px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;transition:background .3s,border-color .3s}
.tile.on{background:var(--surface-2);border-color:var(--lamp-dim)}
.tbtn{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;border-radius:8px}
.tbtn:focus-visible{outline:2px solid var(--moon);outline-offset:4px}

.tile.on .ic{color:var(--lamp);box-shadow:0 0 0 1px var(--lamp-dim),0 0 18px var(--lamp-dim)}
.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tname{font-weight:600;font-size:14px}
.tsub{font-size:12px;color:var(--muted)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;cursor:pointer;--p:50%}

.tile.on input[type=range]{--fill:var(--lamp)}

.save{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.empty{color:var(--muted);font-size:13px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--sky) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}

<header>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="wrap">
    <h1>Hush<em>.</em></h1>
    <p class="lede">Tap sounds to layer them, drag the sliders to balance the mix, and set a timer to fade out as you drift off.</p>
    <div class="presets" id="presets" aria-label="Preset mixes"></div>
  </div>
</header>

<main class="wrap" id="board"></main>

<section class="wrap">
  <h2>Your mixes</h2>
  <form class="save" id="saveForm">
    <input id="mixName" type="text" placeholder="Name this mix, e.g. Tuesday rain" maxlength="40" autocomplete="off" aria-label="Mix name">
    <button class="btn" type="submit">Save mix</button>
  </form>
  <div id="saved"></div>
  <p class="foot">Every sound is generated live in your browser, so it never repeats exactly the same way twice.</p>
</section>

<audio id="keep" loop playsinline hidden></audio>
<div class="bar">
  <div class="wrap">
    <button class="play" id="play" aria-label="Play"></button>
    <div class="now"><b id="nowTitle">Rainy cabin</b><span id="nowSub">Paused</span></div>
    <div class="ctl">
      <button class="chip" id="wake" type="button" aria-pressed="true">Screen on</button>
      <select id="timer" aria-label="Sleep timer">
        <option value="0">No timer</option>
        <option value="5">5 min</option>
        <option value="15">15 min</option>
        <option value="30">30 min</option>
        <option value="45">45 min</option>
        <option value="60">1 hour</option>
        <option value="90">1.5 hours</option>
        <option value="120">2 hours</option>
      </select>
      <label><svg class="vic" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>
        <input id="master" type="range" min="0" max="100" value="80" aria-label="Master volume"></label>
    </div>
  </div>
</div>

<script>
/* ---------- icons ---------- */
const I={
 rain:'<path d="M7 14a4 4 0 1 1 1-7.9A5 5 0 0 1 18 8a3 3 0 0 1 0 6Z"/><path d="M8 17l-1 3M12 17l-1 3M16 17l-1 3"/>',

 owl:'<path d="M6 5l2 2h8l2-2v9a6 6 0 0 1-12 0Z"/><circle cx="9.5" cy="11" r="1.6"/><circle cx="14.5" cy="11" r="1.6"/><path d="M12 13.5V15"/>',

 note:'<path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>',
 phones:'<path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>',
 box:'<rect x="4" y="9" width="16" height="11" rx="2"/><path d="M4 9l3-5h10l3 5M12 13v3"/>',
 piano:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 5v14M13 5v14M18 5v14M6.5 5v7M11 5v7M15.5 5v7"/>',

};

/* ---------- catalogue ---------- */
const SOUNDS=[
 {g:'Rain & storm',items:[
  {id:'rain',n:'Rain',s:'Steady downpour',ic:'rain'},
  {id:'drizzle',n:'Drizzle',s:'Light, soft rain',ic:'drizzle'},
  {id:'roof',n:'Tin roof',s:'Rain on metal',ic:'roof'},
  {id:'thunder',n:'Thunder',s:'Distant rumbles',ic:'thunder'}]},
 {g:'Water',items:[
  {id:'ocean',n:'Ocean',s:'Slow rolling waves',ic:'ocean'},
  {id:'stream',n:'Stream',s:'Babbling brook',ic:'stream'},
  {id:'waterfall',n:'Waterfall',s:'Constant rush',ic:'waterfall'},
  {id:'drips',n:'Cave drips',s:'Echoing drops',ic:'drips'},
  {id:'underwater',n:'Underwater',s:'Muffled and deep',ic:'underwater'}]},
 {g:'Outdoors',items:[
  {id:'wind',n:'Wind',s:'Gusts through trees',ic:'wind'},
  {id:'fire',n:'Campfire',s:'Crackling logs',ic:'fire'},
  {id:'birds',n:'Birdsong',s:'Early morning',ic:'birds'},
  {id:'crickets',n:'Crickets',s:'Summer night',ic:'crickets'},
  {id:'frogs',n:'Frogs',s:'Pond chorus',ic:'frogs'},
  {id:'owl',n:'Owl',s:'Calls in the dark',ic:'owl'}]},
 {g:'Cosy indoors',items:[
  {id:'purr',n:'Cat purr',s:'Contented cat',ic:'purr'},
  {id:'heartbeat',n:'Heartbeat',s:'Slow, 60 bpm',ic:'heart'},
  {id:'clock',n:'Clock',s:'Tick, tock',ic:'clock'},
  {id:'train',n:'Night train',s:'Wheels on rails',ic:'train'},
  {id:'plane',n:'Plane cabin',s:'Cruising hum',ic:'plane'},
  {id:'fan',n:'Fan',s:'Bedroom fan hum',ic:'fan'}]},
 {g:'Tones',items:[
  {id:'chimes',n:'Wind chimes',s:'Pentatonic, random',ic:'chimes'},
  {id:'bowl',n:'Singing bowl',s:'Long resonance',ic:'bowl'},
  {id:'drone',n:'Warm drone',s:'Low, slow pad',ic:'drone'},
  {id:'theta',n:'Theta beats',s:'6 Hz, use headphones',ic:'phones'}]},
 {g:'Lullabies',items:[
  {id:'musicbox',n:'Music box',s:'Brahms\u2019 Lullaby',ic:'box'},
  {id:'twinkle',n:'Twinkle piano',s:'Twinkle, Twinkle',ic:'piano'},
  {id:'harp',n:'Harp lullaby',s:'Slow arpeggios',ic:'harp'},
  {id:'lullaby',n:'Dream notes',s:'Wandering melody',ic:'note'}]},

  {id:'white',n:'White noise',s:'Bright and even',ic:'noise'},
  {id:'pink',n:'Pink noise',s:'Softer, balanced',ic:'noise'},
  {id:'brown',n:'Brown noise',s:'Deep and low',ic:'noise'}]}
];
const BYID={};SOUNDS.forEach(g=>g.items.forEach(i=>BYID[i.id]=i));

const PRESETS=[
 {name:'Rainy cabin',mix:{rain:60,fire:40,thunder:25}},
 {name:'Seaside night',mix:{ocean:70,wind:25,crickets:20}},
 {name:'Forest morning',mix:{birds:55,stream:45,wind:20}},
 {name:'Deep focus',mix:{brown:55,drone:25}},
 {name:'Meditation',mix:{bowl:55,chimes:30,drone:30}},
 {name:'Thunderstorm',mix:{rain:75,thunder:65,wind:35}},
 {name:'Baby sleep',mix:{pink:55,fan:30,heartbeat:25}},
 {name:'Lullaby time',mix:{musicbox:55,pink:20,heartbeat:15}},
 {name:'Night train',mix:{train:65,drizzle:35}},
 {name:'Cat nap',mix:{purr:55,roof:35,fire:25}},
 {name:'Swamp night',mix:{frogs:45,crickets:35,owl:45}},

];

/* ---------- storage (best effort) ---------- */
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- state ---------- */
let mix=store.get('hush.mix',null)||{...PRESETS[0].mix};
let mixTitle=store.get('hush.title','Rainy cabin');
let saved=store.get('hush.saved',[]);
let masterVol=store.get('hush.master',80);
let playing=false;
const live={};

/* ---------- audio engine ---------- */
let ac,master,BUF={};
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];

function ensureCtx(){
  if(!ac){
    ac=new (window.AudioContext||window.webkitAudioContext)();
    const comp=ac.createDynamicsCompressor();
    comp.threshold.value=-16;comp.ratio.value=4;comp.attack.value=.01;comp.release.value=.3;
    master=ac.createGain();master.gain.value=mv(masterVol);
    master.connect(comp);comp.connect(ac.destination);
    makeBuffers();
  }
  if(ac.state!=='running')ac.resume();
}
const mv=v=>Math.pow(v/100,2);

function makeBuffers(){
  const len=ac.sampleRate*6;
  ['white','pink','brown'].forEach(t=>{
    const b=ac.createBuffer(2,len,ac.sampleRate);
    for(let c=0;c<2;c++){
      const d=b.getChannelData(c);
      let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0,last=0;
      for(let i=0;i<len;i++){
        const w=Math.random()*2-1;
        if(t==='white')d[i]=w;
        else if(t==='pink'){
          b0=.99886*b0+w*.0555179;b1=.99332*b1+w*.0750759;b2=.969*b2+w*.153852;
          b3=.8665*b3+w*.3104856;b4=.55*b4+w*.5329522;b5=-.7616*b5-w*.016898;
          d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11;b6=w*.115926;
        }else{last=(last+.02*w)/1.02;d[i]=last*3.5}
      }
      // crossfade loop seam
      const f=2048;for(let i=0;i<f;i++){const k=i/f;d[i]=d[i]*k+d[len-f+i]*(1-k)}
    }
    BUF[t]=b;
  });
}

function src(L,type){const s=ac.createBufferSource();s.buffer=BUF[type];s.loop=true;s.start(ac.currentTime,rand(0,5));L.srcs.push(s);return s}
function filt(type,freq,Q=.7){const f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=Q;return f}
function gain(v){const g=ac.createGain();g.gain.value=v;return g}
function chain(...n){for(let i=0;i<n.length-1;i++)n[i].connect(n[i+1]);return n[n.length-1]}
function osc(L,type,freq){const o=ac.createOscillator();o.type=type;o.frequency.value=freq;o.start();L.srcs.push(o);return o}
function panner(p){if(ac.createStereoPanner){const s=ac.createStereoPanner();s.pan.value=p;return s}return gain(1)}

function echo(out,dt,fb,cut){const inp=gain(1),d=ac.createDelay(2),lp=filt('lowpass',cut),f=gain(fb);d.delayTime.value=dt;inp.connect(out);inp.connect(d);d.connect(lp);lp.connect(f);f.connect(d);lp.connect(out);return inp}
const NI={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function mf(n){const m=n.match(/^([A-G])(#|b)?(\d)$/);return 440*Math.pow(2,(NI[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0)+(+m[3]+1)*12-69)/12)}
function melody(L,seq,unit,voice,rest=4){
  const N=seq.trim().split(/\s+/).map(x=>{const[n,d]=x.split(':');return[mf(n),+d]});let i=0;
  sched(L,()=>{const d=N[i][1]*unit;i++;if(i>=N.length){i=0;return d+rest*unit}return d},t=>voice(t,N[i][0]),.3);
}
// lookahead scheduler so events keep flowing even when timers are throttled
function sched(L,gap,ev,first=.1){
  let next=ac.currentTime+first;
  const tick=()=>{
    const now=ac.currentTime;
    if(next<now-1)next=now+.05;
    while(next<now+1.5){if(next>=now)ev(next);next+=gap()}
  };
  tick();L.timers.push(setInterval(tick,200));
}
function burst(dest,t,dur,g,ft,fq,Q,bt='white'){
  const s=ac.createBufferSource();s.buffer=BUF[bt];
  const f=filt(ft,fq,Q),e=ac.createGain();
  e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(g,t+Math.min(.004,dur/3));
  e.gain.exponentialRampToValueAtTime(.0001,t+dur);
  chain(s,f,e,dest);s.start(t,rand(0,5));s.stop(t+dur+.05);
}
function tone(dest,t,f,dur,g,{type='sine',fEnd,sweep,attack=.005}={}){
  const o=ac.createOscillator(),e=ac.createGain();o.type=type;
  o.frequency.setValueAtTime(f,t);if(fEnd)o.frequency.exponentialRampToValueAtTime(fEnd,t+(sweep||dur));
  e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(g,t+attack);
  e.gain.exponentialRampToValueAtTime(.0001,t+dur);
  chain(o,e,dest);o.start(t);o.stop(t+dur+.05);
}

const ENGINES={
  rain(L,out){
    chain(src(L,'pink'),filt('highpass',500),filt('lowpass',7000),gain(.9),out);
    chain(src(L,'brown'),filt('lowpass',600),gain(.35),out);
    sched(L,()=>rand(.008,.05),t=>burst(out,t,rand(.01,.03),rand(.03,.14),'bandpass',rand(2000,7000),rand(1,4)));
  },
  thunder(L,out){
    chain(src(L,'brown'),filt('lowpass',110),gain(.5),out);
    sched(L,()=>rand(12,28),t=>{
      const s=ac.createBufferSource();s.buffer=BUF.brown;
      const f=filt('lowpass',rand(160,380)),e=ac.createGain(),pk=rand(.9,1.6),len=rand(5,9);
      e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(pk,t+rand(.3,1));
      e.gain.setTargetAtTime(pk*.5,t+1.2,.6);e.gain.linearRampToValueAtTime(pk*.8,t+2.2);
      e.gain.exponentialRampToValueAtTime(.0001,t+len);
      chain(s,f,e,out);s.start(t,rand(0,5));s.stop(t+len+.1);
    },rand(1.5,4));
  },
  ocean(L,out){
    const lp=filt('lowpass',400),g=gain(.15);
    chain(src(L,'brown'),lp,g,out);
    chain(src(L,'pink'),filt('highpass',1500),filt('lowpass',4000),gain(.0),out);
    sched(L,()=>rand(6.5,10.5),t=>{
      const pk=rand(.7,1.1);
      g.gain.setTargetAtTime(pk,t,1.1);g.gain.setTargetAtTime(.12,t+2.9,2.1);
      lp.frequency.setTargetAtTime(rand(1300,2000),t,1);lp.frequency.setTargetAtTime(380,t+2.6,1.8);
    },.2);
  },
  stream(L,out){
    const g=gain(.35);chain(src(L,'white'),filt('highpass',400),filt('lowpass',2600),g,out);
    const lfo=osc(L,'sine',.37),d=gain(.08);chain(lfo,d,g.gain);
    sched(L,()=>rand(.04,.25),t=>{const f=rand(350,1300);tone(out,t,f,rand(.04,.09),rand(.02,.06),{fEnd:f*rand(1.3,2.1)})});
  },
  wind(L,out){
    const bp=filt('bandpass',500,.9),g=gain(.6);chain(src(L,'pink'),bp,g,out);
    const hp=filt('bandpass',1800,3),g2=gain(.05);chain(src(L,'white'),hp,g2,out);
    sched(L,()=>rand(1.5,3.5),t=>{
      bp.frequency.setTargetAtTime(rand(250,950),t,1.2);g.gain.setTargetAtTime(rand(.3,1.2),t,1.4);
      hp.frequency.setTargetAtTime(rand(1200,2600),t,1);g2.gain.setTargetAtTime(rand(0,.08),t,1.2);
    });
  },
  fire(L,out){
    chain(src(L,'brown'),filt('lowpass',450),gain(.7),out);
    sched(L,()=>Math.random()<.18?rand(.005,.04):rand(.06,.45),t=>{
      burst(out,t,rand(.003,.014),rand(.15,.7),'highpass',rand(1400,4500),.7);
      if(Math.random()<.08)burst(out,t,rand(.03,.07),rand(.3,.6),'bandpass',rand(200,500),2,'brown');
    });
  },
  birds(L,out){
    sched(L,()=>rand(1.2,5),t=>{
      const p=panner(rand(-.8,.8)),g=gain(1);chain(p,g,out);
      const n=Math.floor(rand(2,6)),base=rand(2400,4600),up=Math.random()<.5;
      for(let i=0;i<n;i++){
        const st=t+i*rand(.09,.16),f=base*rand(.92,1.08);
        tone(p,st,f,rand(.06,.13),rand(.05,.11),{fEnd:up?f*rand(1.2,1.5):f*rand(.6,.8)});
      }
      setTimeout(()=>{try{p.disconnect()}catch(e){}},(t-ac.currentTime+3)*1000);
    },.3);
  },
  crickets(L,out){
    [[4400,-.5],[4700,.55],[4150,.1]].forEach(([f,pan],k)=>{
      const p=panner(pan);chain(p,out);
      sched(L,()=>rand(.45,1.1),t=>{const n=Math.floor(rand(3,5));for(let i=0;i<n;i++)tone(p,t+i*.045,f,.03,.045,{attack:.004})},rand(0,.6)+k*.2);
    });
  },
  chimes(L,out){
    const notes=[523.25,587.33,659.25,783.99,880,1046.5,1174.66];
    sched(L,()=>rand(.6,4.5),t=>{
      const f=pick(notes),p=panner(rand(-.7,.7));chain(p,out);
      tone(p,t,f,rand(3,5),.12,{attack:.003});tone(p,t,f*2.76,1.5,.035,{attack:.003});tone(p,t,f*5.4,.6,.012,{attack:.003});
      setTimeout(()=>{try{p.disconnect()}catch(e){}},(t-ac.currentTime+6)*1000);
    },.2);
  },
  bowl(L,out){
    sched(L,()=>rand(9,15),t=>{
      const f=pick([174.6,196,220,246.9]);
      [[1,.22,10],[1.004,.14,10],[2.76,.08,7],[2.765,.05,7],[5.4,.025,3.5]].forEach(([m,g,d])=>tone(out,t,f*m,d,g,{attack:.02}));
    },.15);
  },
  drone(L,out){
    const lp=filt('lowpass',380,1.5),g=gain(.18);chain(lp,g,out);
    [[55,'sawtooth'],[55.35,'sawtooth'],[82.4,'triangle'],[110.2,'sine']].forEach(([f,t])=>{const o=osc(L,t,f);chain(o,gain(.25),lp)});
    const lfo=osc(L,'sine',.045),d=gain(160);chain(lfo,d,lp.frequency);
  },
  white(L,out){chain(src(L,'white'),filt('lowpass',9500),gain(.22),out)},
  pink(L,out){chain(src(L,'pink'),gain(.55),out)},
  brown(L,out){chain(src(L,'brown'),gain(1),out)},
  fan(L,out){
    chain(src(L,'pink'),filt('lowpass',850),gain(.75),out);
    chain(osc(L,'sine',118),gain(.025),out);
    const g=gain(.06);chain(src(L,'white'),filt('bandpass',2400,4),g,out);
  },
  drizzle(L,out){
    chain(src(L,'pink'),filt('highpass',1200),filt('lowpass',6000),gain(.35),out);
    sched(L,()=>rand(.04,.18),t=>burst(out,t,rand(.008,.02),rand(.02,.08),'bandpass',rand(3000,8000),rand(1,3)));
  },
  roof(L,out){
    chain(src(L,'pink'),filt('bandpass',2500,.6),gain(.3),out);
    chain(src(L,'brown'),filt('lowpass',300),gain(.3),out);
    sched(L,()=>rand(.01,.06),t=>{
      burst(out,t,rand(.005,.015),rand(.05,.18),'bandpass',rand(1500,5000),rand(2,6));
      if(Math.random()<.12)tone(out,t,rand(1800,3200),rand(.08,.18),rand(.01,.03),{type:'triangle',attack:.001});
    });
  },
  waterfall(L,out){
    chain(src(L,'white'),filt('highpass',250),filt('lowpass',3500),gain(.35),out);
    chain(src(L,'brown'),filt('lowpass',500),gain(.9),out);
    const g=gain(.15);chain(src(L,'pink'),filt('bandpass',900,.5),g,out);chain(osc(L,'sine',.21),gain(.06),g.gain);
  },
  drips(L,out){
    const e=echo(out,.27,.45,2500);chain(src(L,'brown'),filt('lowpass',200),gain(.12),out);
    sched(L,()=>rand(.5,2.4),t=>{const f=rand(900,1800);tone(e,t,f,rand(.15,.3),rand(.08,.16),{fEnd:f*rand(1.5,2.2),sweep:.035,attack:.002})},.2);
  },
  underwater(L,out){
    const lp=filt('lowpass',260,2);chain(src(L,'brown'),lp,gain(.9),out);
    chain(osc(L,'sine',.08),gain(90),lp.frequency);
    sched(L,()=>Math.random()<.3?rand(.03,.1):rand(.4,2),t=>{const f=rand(160,420);tone(out,t,f,rand(.08,.18),rand(.03,.08),{fEnd:f*rand(1.6,2.6),attack:.01})});
  },
  frogs(L,out){
    [[-.6,1],[.5,1.25],[.05,.85]].forEach(([pan,m],k)=>{
      const p=panner(pan),bp=filt('bandpass',700*m,3);chain(bp,p,out);
      sched(L,()=>rand(.6,2.6),t=>{const n=Math.floor(rand(2,5)),f=rand(90,140)*m;for(let i=0;i<n;i++)tone(bp,t+i*.034,f,.028,.35,{type:'sawtooth',attack:.004})},rand(0,1)+k*.4);
    });
  },
  owl(L,out){
    const e=echo(out,.33,.35,1500),p=panner(rand(-.5,.5));chain(p,e);
    sched(L,()=>rand(7,16),t=>{
      const f=rand(340,400),pat=pick([[0,.75,1.05,1.55],[0,.55],[0,.8,1.3]]);
      pat.forEach((o,i)=>{const last=i===pat.length-1;tone(p,t+o,f*(last?.94:1),last?.75:.42,.12,{fEnd:f*.9,attack:.07})});
    },rand(1,3));
  },
  heartbeat(L,out){
    const lp=filt('lowpass',160);chain(lp,gain(1.6),out);
    sched(L,()=>rand(.98,1.04),t=>{tone(lp,t,62,.16,.9,{fEnd:42,attack:.01});tone(lp,t+.27,55,.14,.6,{fEnd:38,attack:.01})});
  },
  purr(L,out){
    const bp=filt('bandpass',150,1.5),am=gain(.5),g=gain(0);chain(src(L,'brown'),bp,am,g,out);
    chain(osc(L,'sine',24),gain(.5),am.gain);
    sched(L,()=>rand(2.2,2.8),t=>{
      g.gain.setTargetAtTime(2.2,t,.15);g.gain.setTargetAtTime(.6,t+1,.2);g.gain.setTargetAtTime(1.8,t+1.3,.15);g.gain.setTargetAtTime(.2,t+2.05,.12);
      bp.frequency.setTargetAtTime(170,t,.2);bp.frequency.setTargetAtTime(130,t+1.2,.2);
    },.1);
  },
  clock(L,out){
    let k=0;const e=echo(out,.09,.2,3000);
    sched(L,()=>1,t=>{const hi=k++%2===0;burst(e,t,.012,.35,'bandpass',hi?3200:2500,4);tone(e,t,hi?1900:1500,.03,.05,{type:'triangle',attack:.001})});
  },
  train(L,out){
    const g=gain(.9);chain(src(L,'brown'),filt('lowpass',320),g,out);chain(osc(L,'sine',.13),gain(.15),g.gain);
    chain(src(L,'pink'),filt('bandpass',1200,.7),gain(.06),out);
    sched(L,()=>rand(1.55,1.7),t=>{[0,.13].forEach(o=>{burst(out,t+o,.06,1.4,'bandpass',rand(500,800),1.5,'brown');burst(out,t+o,.02,.12,'bandpass',2200,2)})},.3);
  },
  plane(L,out){
    chain(src(L,'brown'),filt('lowpass',380),gain(.9),out);
    chain(src(L,'pink'),filt('bandpass',550,.8),gain(.35),out);
    chain(src(L,'white'),filt('bandpass',3000,1),gain(.03),out);
    chain(osc(L,'sine',96),gain(.012),out);
  },
  lullaby(L,out){
    const e=echo(out,.38,.4,2200),notes=[261.63,293.66,329.63,392,440,523.25,587.33];let i=3;
    sched(L,()=>pick([.6,.6,.9,1.2]),t=>{
      i=Math.max(0,Math.min(notes.length-1,i+pick([-2,-1,-1,0,1,1,2])));const f=notes[i];
      tone(e,t,f,1.8,.09,{type:'triangle',attack:.004});tone(e,t,f*2,.8,.025,{attack:.004});
      if(Math.random()<.25)tone(e,t,f/2,2.5,.05,{attack:.004});
    },.2);
  },
  musicbox(L,out){
    const e=echo(out,.29,.38,4000);
    melody(L,'E4:1 E4:1 G4:3 E4:1 E4:2 G4:4 E4:1 G4:1 C5:2 B4:3 A4:1 A4:2 G4:2 D4:1 E4:1 F4:2 D4:2 D4:1 E4:1 F4:4 D4:1 F4:1 B4:1 A4:1 G4:2 B4:2 C5:4 C4:1 C4:1 C5:4 A4:1 F4:1 G4:4 E4:1 C4:1 F4:2 G4:2 A4:2 G4:4 C4:1 C4:1 C5:4 A4:1 F4:1 G4:4 E4:1 C4:1 F4:2 E4:2 D4:2 C4:6',
      .3,(t,f)=>{f*=2;tone(e,t,f,1.6,.07,{attack:.002});tone(e,t,f*2,.6,.02,{attack:.002});tone(e,t,f*3,.25,.01,{attack:.002})},6);
  },
  twinkle(L,out){
    const e=echo(out,.36,.32,2600);
    melody(L,'C4:1 C4:1 G4:1 G4:1 A4:1 A4:1 G4:2 F4:1 F4:1 E4:1 E4:1 D4:1 D4:1 C4:2 G4:1 G4:1 F4:1 F4:1 E4:1 E4:1 D4:2 G4:1 G4:1 F4:1 F4:1 E4:1 E4:1 D4:2 C4:1 C4:1 G4:1 G4:1 A4:1 A4:1 G4:2 F4:1 F4:1 E4:1 E4:1 D4:1 D4:1 C4:2',
      .7,(t,f)=>{tone(e,t,f,2.4,.09,{type:'triangle',attack:.006});tone(e,t,f/2,2.8,.04,{attack:.01});tone(e,t,f*2,.6,.012,{attack:.004})},4);
  },
  harp(L,out){
    const e=echo(out,.31,.35,3000),prog=[[48,52,55,60,64,67],[45,48,52,57,60,64],[41,45,48,53,57,60],[43,47,50,55,59,62]],seq=[0,1,2,3,4,5,4,3,2,1];let c=0,k=0;
    sched(L,()=>.26,t=>{const f=440*Math.pow(2,(prog[c][seq[k]]+12-69)/12);tone(e,t,f,1.6,.08,{type:'triangle',attack:.002});tone(e,t,f*2,.5,.02,{attack:.002});if(++k>=seq.length){k=0;c=(c+1)%prog.length}},.2);
  },
  theta(L,out){
    const m=ac.createChannelMerger(2);m.connect(out);
    const ga=gain(.12),gb=gain(.12);osc(L,'sine',200).connect(ga);osc(L,'sine',206).connect(gb);ga.connect(m,0,0);gb.connect(m,0,1);
  }
};

function startSound(id){
  const out=ac.createGain();out.gain.value=0;out.connect(master);
  const L={srcs:[],timers:[],out};
  ENGINES[id](L,out);
  live[id]=L;setVol(id,mix[id],1.2);
}
function stopSound(id){
  const L=live[id];if(!L)return;delete live[id];
  L.out.gain.cancelScheduledValues(ac.currentTime);
  L.out.gain.setTargetAtTime(0,ac.currentTime,.25);
  L.timers.forEach(clearInterval);
  setTimeout(()=>{L.srcs.forEach(s=>{try{s.stop()}catch(e){}});try{L.out.disconnect()}catch(e){}},1500);
}
function setVol(id,v,tc=.08){const L=live[id];if(L)L.out.gain.setTargetAtTime(mv(v),ac.currentTime,tc)}

function sync(){
  if(!playing||!ac)return;
  Object.keys(mix).forEach(id=>{if(!live[id])startSound(id)});
  Object.keys(live).forEach(id=>{if(!(id in mix))stopSound(id)});
}
function play(){
  if(!Object.keys(mix).length){applyMix(PRESETS[0].mix,PRESETS[0].name)}
  ensureCtx();playing=true;master.gain.cancelScheduledValues(ac.currentTime);master.gain.setTargetAtTime(mv(masterVol),ac.currentTime,.1);
  sync();renderBar();keepAlive(true);lockScreen();mediaInfo();
}
function pause(){
  playing=false;
  if(ac){master.gain.setTargetAtTime(0,ac.currentTime,.12);setTimeout(()=>{if(!playing)ac.suspend()},450)}
  renderBar();keepAlive(false);unlockScreen();
}

/* ---------- UI ---------- */
const $=s=>document.querySelector(s);
const svg=k=>`<svg viewBox="0 0 24 24" aria-hidden="true">${I[k]}</svg>`;
function paint(r){r.style.setProperty('--p',r.value+'%')}

function renderBoard(){
  $('#board').innerHTML=SOUNDS.map(g=>`<section><div class="label">${g.items.length} sounds</div><h2>${g.g}</h2><div class="grid">${
    g.items.map(i=>`<div class="tile" data-id="${i.id}">
      <button class="tbtn" type="button" aria-pressed="false"><span class="ic">${svg(i.ic)}</span><span><span class="tname">${i.n}</span><br><span class="tsub">${i.s}</span></span></button>
      <input type="range" id="v-${i.id}" min="0" max="100" value="50" aria-label="${i.n} volume">
    </div>`).join('')}</div></section>`).join('');
  document.querySelectorAll('.tile').forEach(t=>{
    const id=t.dataset.id,r=t.querySelector('input');
    t.querySelector('.tbtn').onclick=()=>{
      if(id in mix){delete mix[id];stopSound(id)}else{mix[id]=+r.value||50;if(!playing)play();else sync()}
      customTitle();refresh();
    };
    r.oninput=()=>{paint(r);const v=+r.value;
      if(!(id in mix)){if(v===0)return;mix[id]=v;if(!playing)play();else sync();customTitle()}
      else mix[id]=v;
      setVol(id,v);persist();renderTiles();renderBar();
    };
  });
}
function renderTiles(){
  document.querySelectorAll('.tile').forEach(t=>{
    const id=t.dataset.id,on=id in mix,r=t.querySelector('input');
    t.classList.toggle('on',on);t.querySelector('.tbtn').setAttribute('aria-pressed',on);
    if(on&&+r.value!==mix[id])r.value=mix[id];paint(r);
  });
}
function renderPresets(){
  $('#presets').innerHTML=PRESETS.map((p,i)=>`<button class="chip" type="button" data-i="${i}">${p.name}</button>`).join('');
  $('#presets').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const p=PRESETS[b.dataset.i];applyMix(p.mix,p.name);play()});
}
function renderSaved(){
  const el=$('#saved');
  if(!saved.length){el.innerHTML='<span class="empty">Saved mixes appear here. They stay in this browser only.</span>';return}
  el.innerHTML=saved.map((s,i)=>`<span class="chip" role="button" tabindex="0" data-i="${i}">${esc(s.name)}<span class="x" data-del="${i}" role="button" tabindex="0" aria-label="Delete ${esc(s.name)}">×</span></span>`).join('');
  el.querySelectorAll('.chip').forEach(c=>{
    const go=e=>{const d=e.target.closest('[data-del]');if(d){saved.splice(+d.dataset.del,1);store.set('hush.saved',saved);renderSaved();return}const s=saved[c.dataset.i];applyMix(s.mix,s.name);play()};
    c.onclick=go;c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go(e)}};
  });
}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const PLAY='<svg viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10-6.5a1 1 0 0 0 0-1.7l-10-6.5A1 1 0 0 0 8 5.5Z"/></svg>';
const PAUSE='<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
let timerEnd=0,fading=false;
function renderBar(){
  $('#play').innerHTML=playing?PAUSE:PLAY;$('#play').setAttribute('aria-label',playing?'Pause':'Play');
  const ids=Object.keys(mix),n=ids.length;
  $('#nowTitle').textContent=n?mixTitle:'Nothing selected';
  let sub=n?ids.map(i=>BYID[i].n).join(', '):'Tap a sound to begin';
  if(!playing&&n)sub='Paused · '+sub;
  if(timerEnd&&playing){const s=Math.max(0,Math.round((timerEnd-Date.now())/1000));sub=`Fades out in ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} · `+sub}
  $('#nowSub').textContent=sub;
}
function applyMix(m,title){
  Object.keys(mix).forEach(id=>{if(!(id in m))stopSound(id)});
  mix={...m};mixTitle=title;
  Object.keys(mix).forEach(id=>{const r=$('#v-'+id);if(r)r.value=mix[id];setVol(id,mix[id],.3)});
  sync();refresh();
}
function customTitle(){mixTitle=Object.keys(mix).length?'Custom mix':'Nothing selected'}
function persist(){store.set('hush.mix',mix);store.set('hush.title',mixTitle)}
function refresh(){persist();renderTiles();renderBar()}

$('#play').onclick=()=>playing?pause():play();
const mr=$('#master');mr.value=masterVol;paint(mr);
mr.oninput=()=>{paint(mr);masterVol=+mr.value;store.set('hush.master',masterVol);if(ac&&playing&&!fading)master.gain.setTargetAtTime(mv(masterVol),ac.currentTime,.05)};
$('#timer').onchange=e=>{const m=+e.target.value;timerEnd=m?Date.now()+m*60000:0;fading=false;if(m&&!playing)play();renderBar()};
setInterval(()=>{
  if(!timerEnd||!playing)return;
  const left=(timerEnd-Date.now())/1000;
  if(left<=30&&!fading&&ac){fading=true;master.gain.setTargetAtTime(0,ac.currentTime,Math.max(left,1)/4)}
  if(left<=0){timerEnd=0;fading=false;$('#timer').value='0';pause()}
  renderBar();
},1000);
$('#saveForm').onsubmit=e=>{
  e.preventDefault();const name=$('#mixName').value.trim();
  if(!Object.keys(mix).length){$('#mixName').placeholder='Turn on at least one sound first';return}
  const nm=name||('Mix '+(saved.length+1));saved.unshift({name:nm,mix:{...mix}});saved=saved.slice(0,20);
  store.set('hush.saved',saved);mixTitle=nm;$('#mixName').value='';renderSaved();refresh();
};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|SELECT|BUTTON|TEXTAREA/.test(e.target.tagName)&&!e.target.closest('.chip')){e.preventDefault();$('#play').click()}});

/* ---------- keep playing: wake lock, silent media session, resume ---------- */
function silentWav(){const sr=8000,n=sr,b=new ArrayBuffer(44+n*2),v=new DataView(b),w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++)v.setInt16(44+i*2,i%2?1:-1,true);
  let s='';const u=new Uint8Array(b);for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return 'data:audio/wav;base64,'+btoa(s)}
const keepEl=$('#keep');
function keepAlive(on){try{if(on){if(!keepEl.src)keepEl.src=silentWav();keepEl.volume=.01;const p=keepEl.play();if(p)p.catch(()=>{})}else keepEl.pause()}catch(e){}}
let wakeOn=store.get('hush.wake',true),wl=null;
async function lockScreen(){if(!wakeOn||!playing||wl||!navigator.wakeLock)return;try{wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}catch(e){}}
function unlockScreen(){if(wl){wl.release().catch(()=>{});wl=null}}
function renderWake(){const b=$('#wake');b.setAttribute('aria-pressed',wakeOn);b.textContent=wakeOn?'Screen on':'Screen can sleep';b.style.borderColor=wakeOn?'var(--lamp)':''}
$('#wake').onclick=()=>{wakeOn=!wakeOn;store.set('hush.wake',wakeOn);renderWake();wakeOn?lockScreen():unlockScreen()};
renderWake();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&playing){if(ac&&ac.state!=='running')ac.resume();keepAlive(true);lockScreen()}});
function mediaInfo(){try{if(!('mediaSession' in navigator))return;navigator.mediaSession.metadata=new MediaMetadata({title:mixTitle,artist:'Hush'});
  navigator.mediaSession.setActionHandler('play',()=>play());navigator.mediaSession.setActionHandler('pause',()=>pause());navigator.mediaSession.playbackState='playing'}catch(e){}}

renderBoard();renderPresets();renderSaved();refresh();

/* ---------- starfield ---------- */
(()=>{
  const c=$('#stars'),x=c.getContext('2d'),still=matchMedia('(prefers-reduced-motion: reduce)').matches;let st=[],w,h;
  function size(){const d=devicePixelRatio||1;w=c.clientWidth;h=c.clientHeight;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0);
    st=Array.from({length:Math.round(w*h/2200)},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.2+.2,p:Math.random()*6.3,s:rand(.3,1.1)}))}
  function draw(t){x.clearRect(0,0,w,h);for(const s of st){const a=still?.6:.35+.45*Math.sin(s.p+t/1000*s.s);x.fillStyle=`rgba(233,230,243,${a*(1-s.y/h*.7)})`;x.beginPath();x.arc(s.x,s.y,s.r,0,6.3);x.fill()}if(!still)requestAnimationFrame(draw)}
  size();addEventListener('resize',size);requestAnimationFrame(draw);
})();
</script>
